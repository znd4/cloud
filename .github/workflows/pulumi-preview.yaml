name: Pulumi preview
on:
  push:

permissions:
  id-token: write
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    environment: production
    strategy:
      matrix:
        stack:
          - dir: dnsimple
            name: znd4/dns/dns
          - dir: pulumi
            name: znd4/prod/pulumi

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: pulumi/auth-actions@1c89817aab0c66407723cdef72b05266e7376640 # v1.0.1
        with:
          organization: znd4
          requested-token-type: urn:pulumi:token-type:access_token:personal
          scope: user:znd4
      - uses: pulumi/actions@cd99a7f8865434dd3532b586a26f9ebea596894f # v5.5.1
        with:
          command: preview
          stack-name: ${{ matrix.stack.name }}
          work-dir: ${{ matrix.stack.dir }}
