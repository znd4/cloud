# zizmor checks the GitHub Actions workflows in this repository for security
# problems: dangerous triggers such as pull_request_target, template
# injection, unpinned actions and persisted credentials.
# https://docs.zizmor.sh
name: zizmor
on:
  push:
    branches: [main]
  pull_request:

permissions: {}

jobs:
  zizmor:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read # zizmor-action needs this to upload SARIF
      security-events: write # upload findings to code scanning
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
